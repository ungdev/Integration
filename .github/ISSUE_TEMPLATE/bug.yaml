name: 🐛 Bug
description: Signaler un bug
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Décris le bug rencontré.
      placeholder: Que s'est-il passé ?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Indique les étapes pour reproduire le bug.
      placeholder: |
        1. Aller sur...
        2. Cliquer sur...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      placeholder: Ce qui devrait se produire...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportement actuel
      placeholder: Ce qui se produit actuellement...
    validations:
      required: true
