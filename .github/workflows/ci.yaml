name: CI

on:
  push:
    branches:
      - prod
      - dev
  pull_request:
    branches:
      - prod
      - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-api:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Lint
        working-directory: ./backend
        run: npm run lint

  lint-front:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

  build-api:
    runs-on: self-hosted
    if : github.event_name == 'pull_request'
    needs:
      - lint-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          npm ci

      - name: Build 
        working-directory: ./backend
        run: npm run build-test

  build-front:
    runs-on: self-hosted
    if : github.event_name == 'pull_request'
    needs:
      - lint-front
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Build
        working-directory: ./frontend
        run: npm run build

  deploy-api:
    runs-on: self-hosted
    if : github.event_name == 'push'
    environment: ${{ github.ref == 'refs/heads/dev' && 'development' || 'production' }}
    needs:
      - lint-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Install docker
        uses: docker/setup-buildx-action@v3

      - name: API - Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/integration/api:${{ github.ref == 'refs/heads/prod' && 'prod' || 'dev' }}

  deploy-front:
    runs-on: self-hosted
    if : github.event_name == 'push'
    environment: ${{ github.ref == 'refs/heads/dev' && 'development' || 'production' }}
    needs:
      - lint-front
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Install docker
        uses: docker/setup-buildx-action@v3

      - name: Front- Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ vars.API_URL }}
            VITE_SERVICE_URL=${{ vars.SERVICE_URL }}
            VITE_ANALYTICS_WEBSITE_ID=${{ secrets.ANALYTICS_WEBSITE_ID }}
            VITE_ROADBOOK_URL_FRENCH=${{ vars.ROADBOOK_URL_FRENCH }}
            VITE_ROADBOOK_URL_ENGLISH=${{ vars.ROADBOOK_URL_ENGLISH }}
            VITE_CAS_LOGIN_URL=${{ vars.CAS_LOGIN_URL }}
          tags: |
            ${{ secrets.REGISTRY_URL }}/integration/front:${{ github.ref == 'refs/heads/prod' && 'prod' || 'dev' }}
