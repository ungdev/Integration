<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intégration UTT</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f0f0f0; font-family: Arial, sans-serif; color: #333; text-align: center;">
    <div style="max-width: 600px; margin: 0 auto; padding: 30px; background-color: #f9f9f9; border-radius: 8px;">
        <div style="margin-bottom: 20px;">
            <img src="https://integration.utt.fr/img/logo_original.png" alt="Logo Intégration UTT" style="width: 120px; height: auto; display: block; margin: 0 auto;">
            <h1 style="font-size: 24px; color: #e74160; margin: 10px 0 0;">Intégration UTT</h1>
        </div>
        <h2 style="color: #e74160; font-size: 20px; margin: 0 0 10px;">⛺ Mise à jour de ta tente</h2>
        <p style="margin: 10px 0; font-size: 16px; line-height: 1.5;">
            La tente entre <strong>{{user1}}</strong> et <strong>{{user2}}</strong> a été
            <strong style="color: {{#if confirmed}}green{{else}}red{{/if}};">
                {{#if confirmed}}validée{{else}}invalidée{{/if}}
            </strong>.
        </p>
        <p style="margin: 10px 0; color: #555;">👉 Tu peux consulter l'état de ta tente sur le site de l'inté dans l'onglet <strong>Tentes</strong>.</p>
        <p style="margin-top: 20px;">
            <a href="https://integration.utt.fr" style="display: inline-block; padding: 12px 20px; background-color: #e74160; color: #fff; text-decoration: none; border-radius: 4px; font-weight: bold;">Accéder au site</a>
        </p>
    </div>
</body>
</html>
